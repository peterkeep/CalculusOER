<article class="definition definition-like"><h2 class="heading">
<span class="type">Definition</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">6.5.7</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Length of a Curve.</span>
</h2>
<div class="para logical">
<div class="para">If <span class="process-math">\(f(x)\)</span> is continuous on the interval <span class="process-math">\([a,b]\)</span> and differentiable on <span class="process-math">\((a,b)\text{,}\)</span> then the length of the curve <span class="process-math">\(y=f(x)\)</span> from <span class="process-math">\(x=a\)</span> to <span class="process-math">\(x=b\)</span> is:</div>
<div class="displaymath process-math">
\begin{equation*}
\int_{x=a}^{x=b}\sqrt{1+(f'(x))^2}\;dx\text{.}
\end{equation*}
</div>
